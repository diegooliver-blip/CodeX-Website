name: CI

on:
  push:
    branches: [main, platform-v4]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -w web
      - run: npm run typecheck -w web
      - run: npm run build -w web
        env:
          API_URL: http://localhost:8010  # pages fall back to empty data when the API is down

  api:
    name: API (ruff, pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: codex
          POSTGRES_DB: codex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codex" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
        env:
          TEST_ADMIN_DSN: postgresql://codex:codex@localhost:5432/codex
          CONTENT_DIR: ${{ github.workspace }}/content

  e2e:
    name: E2E (Playwright on docker compose)
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Local env with a throwaway JWT secret (.env.example leaves it empty, which PyJWT rejects)
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=ci-$(openssl rand -hex 24)/" .env
      - run: docker compose up -d --build --wait
      - name: Wait for API and web
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8010/health && curl -fsS -o /dev/null http://localhost:3000 && exit 0
            sleep 5
          done
          exit 1
      - run: docker compose exec -T -e ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" api python -m app.cli create-admin "$E2E_ADMIN_EMAIL" "E2E Admin"
        env:
          E2E_ADMIN_EMAIL: admin@codexai.com
          E2E_ADMIN_PASSWORD: codex-admin-2026
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e -w web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
      - if: always()
        run: docker compose logs --no-color > compose.log && tail -200 compose.log
