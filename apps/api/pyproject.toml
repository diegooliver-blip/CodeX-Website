[project]
name = "codex-api"
version = "3.0.0"
requires-python = ">=3.12"

[tool.ruff]
extend-exclude = ["alembic/versions"]  # applied migrations are immutable
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
