# Production backend for a VPS (the Next.js frontend runs on Vercel).
#
#   cp infra/.env.prod.example infra/.env.prod   # fill every value
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
#
# Caddy terminates HTTPS (automatic Let's Encrypt) for:
#   API_DOMAIN    -> api     (only the Vercel server calls it, guarded by INTERNAL_API_KEY)
#   MEDIA_DOMAIN  -> storage (presigned video/PDF uploads and downloads from the browser)
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: codex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: codex
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex"]
      interval: 5s
      retries: 20

  storage:
    image: rustfs/rustfs:1.0.2
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      RUSTFS_CORS_ALLOWED_ORIGINS: ${SITE_URL:?set SITE_URL}
    volumes: [objectdata:/data]

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://codex:${POSTGRES_PASSWORD}@db:5432/codex
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      WEB_ORIGIN: ${SITE_URL}
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: https://${MEDIA_DOMAIN:?set MEDIA_DOMAIN}
      S3_BUCKET: codex-media
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOOPS_API_KEY: ${LOOPS_API_KEY:-}
      CONTENT_DIR: /content
    volumes:
      - ../content:/content:ro
    healthcheck:  # 200 whenever the database answers (worker/storage issues show as "degradado")
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_started }

  worker:  # outbox delivery (Loops.so), heartbeats and daily cleanup
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      APP_ROLE: worker
      DATABASE_URL: postgresql+asyncpg://codex:${POSTGRES_PASSWORD}@db:5432/codex
      LOOPS_API_KEY: ${LOOPS_API_KEY:-}
    stop_grace_period: 30s
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api, storage]

volumes:
  pgdata:
  objectdata:
  caddydata:
  caddyconfig:
